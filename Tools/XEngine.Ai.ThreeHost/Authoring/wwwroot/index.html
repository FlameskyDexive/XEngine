<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>XEngine Three.js Authoring</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101418; }
    #app { width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 8px; top: 6px; z-index: 10;
      font: 12px/1.5 Consolas, monospace; color: #9fd0ff;
      background: rgba(8, 12, 18, 0.55); padding: 4px 8px; border-radius: 4px;
      pointer-events: none; white-space: pre;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js"
    }
  }
  </script>
  <script>
    // Module-load failures never reach window.onerror; surface them on the HUD via the capture
    // phase error event on the script element itself.
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        var hud = document.getElementById('hud');
        if (hud) hud.textContent = 'MODULE LOAD ERROR — ' + (e.target.src || '');
      }
    }, true);
  </script>
</head>
<body>
  <div id="hud">initializing…</div>
  <div id="app"></div>
  <script type="module" src="./host.js"></script>
</body>
</html>
